<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperX — السجل</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-anim"></div>

<header class="topbar">
  <div class="logo">📚 HyperX <span class="ver">السجل</span></div>
  <div class="sub">كل تحليلاتك محفوظة تلقائياً</div>
  <div class="topbar-actions">
    <a href="/" class="btn-ghost">🏠 الرئيسية</a>
    <button id="clearAllBtn" class="btn-ghost danger">🗑️ حذف الكل</button>
  </div>
</header>

<main class="container">

  <section class="card">
    <h2>📊 إحصائيات كلية</h2>
    <div class="grid" id="globalStats"></div>
  </section>

  <section class="card">
    <h2>🔍 بحث</h2>
    <input class="filter" id="searchInput" placeholder="🔍 ابحث بالاسم أو الحزمة أو اسم التطبيق...">
    <div class="list" id="historyList"></div>
  </section>

</main>

<footer class="footer">
  <div>═══════════════════════════════</div>
  <div>Developed by: ريمو براون</div>
  <div>© 2026 All Rights Reserved</div>
  <div>═══════════════════════════════</div>
</footer>

<script src="/static/history.js"></script>
</body>
</html>
